name: Publish stable

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Validate release configuration
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "${R2_BUCKET}" || { echo "R2_BUCKET is not configured" >&2; exit 1; }
          test -n "${R2_PUBLIC_URL}" || { echo "R2_PUBLIC_URL is not configured" >&2; exit 1; }
          test -n "${R2_ENDPOINT}" || { echo "R2_ENDPOINT is not configured" >&2; exit 1; }
          test -n "${R2_ACCESS_KEY_ID}" || { echo "R2_ACCESS_KEY_ID is not configured" >&2; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY}" || { echo "R2_SECRET_ACCESS_KEY is not configured" >&2; exit 1; }
      - name: Verify tagged source
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
          go fix ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          git diff --exit-code
          go vet ./...
          go test ./...
      - name: Build stable release
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" stable "${{ vars.R2_PUBLIC_URL }}"
      - name: Sign and verify stable release
        run: scripts/sign-release.sh dist/release-stable
      - name: Refuse to overwrite an existing release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          version="${GITHUB_REF_NAME#v}"
          existing="$(aws s3api list-objects-v2 \
            --bucket "${{ vars.R2_BUCKET }}" --prefix "releases/${version}/" --max-keys 1 \
            --query KeyCount --output text --endpoint-url "${{ secrets.R2_ENDPOINT }}")"
          test "${existing}" = 0 || {
            echo "Release ${version} already exists and will not be overwritten" >&2
            exit 1
          }
      - name: Upload immutable artifacts and channel files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp dist/release-stable/releases "s3://${{ vars.R2_BUCKET }}/releases" --recursive \
            --cache-control 'public,max-age=31536000,immutable' --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp dist/release-stable/install.sh "s3://${{ vars.R2_BUCKET }}/install.sh" \
            --cache-control no-cache --content-type text/x-shellscript --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp dist/release-stable/install.sh "s3://${{ vars.R2_BUCKET }}/ce" \
            --cache-control no-cache --content-type text/x-shellscript --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp dist/release-stable/manifest.json.sigstore.json \
            "s3://${{ vars.R2_BUCKET }}/manifest.json.sigstore.json" \
            --content-type application/json --cache-control no-cache \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp dist/release-stable/manifest.json "s3://${{ vars.R2_BUCKET }}/manifest.json" \
            --content-type application/json --cache-control no-cache \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"
