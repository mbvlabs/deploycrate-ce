name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: go fix ./...
      - name: Verify go fix and formatting produced no diff
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - name: Build release commands
        run: |
          CGO_ENABLED=0 go build ./cmd/app
          CGO_ENABLED=0 go build ./cmd/bootstrap
