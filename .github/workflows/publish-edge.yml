name: Publish edge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: edge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Build edge release
        run: scripts/build-release.sh "edge-${GITHUB_SHA::12}" edge "${{ vars.R2_PUBLIC_URL }}"
      - name: Upload immutable artifacts and channel files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp dist/release-edge/releases "s3://${{ vars.R2_BUCKET }}/releases" --recursive \
            --cache-control 'public,max-age=31536000,immutable' --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp dist/release-edge/install.sh "s3://${{ vars.R2_BUCKET }}/install.sh" \
            --cache-control no-cache --content-type text/x-shellscript --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          aws s3 cp dist/release-edge/manifest.json "s3://${{ vars.R2_BUCKET }}/manifest.json" \
            --content-type application/json --cache-control no-cache \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"
