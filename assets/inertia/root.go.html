<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (() => {
            try {
                document.documentElement.classList.toggle('dark', localStorage.getItem('deploycrate-theme') !== 'light')
            } catch (_) {
                document.documentElement.classList.add('dark')
            }
        })()
    </script>
    <title inertia>DeployCrate CE</title>
    {{ .inertiaHead }}
    {{ .viteHead }}
</head>
<body class="bg-background text-foreground">
    {{ .inertia }}
    {{ .viteBody }}
</body>
</html>
